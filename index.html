<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BizAI - AI Business Advisor</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 95%;
      max-width: 900px;
      height: 90vh;
      background: white;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      background: #111827;
      color: white;
      padding: 22px;
    }

    .header h1 {
      font-size: 26px;
    }

    .header p {
      margin-top: 5px;
      color: #cbd5e1;
    }

    .chat {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .message {
      max-width: 75%;
      padding: 12px 16px;
      margin-bottom: 14px;
      border-radius: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .ai {
      background: #eef2ff;
      color: #111827;
      margin-right: auto;
    }

    .user {
      background: #2563eb;
      color: white;
      margin-left: auto;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 15px;
      border-top: 1px solid #e5e7eb;
      background: #fafafa;
    }

    .input-area input {
      flex: 1;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      outline: none;
      font-size: 16px;
    }

    .input-area button {
      padding: 14px 22px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .input-area button:hover {
      background: #1d4ed8;
    }

    .input-area button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">
      <h1>🤖 BizAI</h1>
      <p>AI Business Advisor</p>
    </div>

    <div class="chat" id="chat">

      <div class="message ai">
        Hello! 👋 I am BizAI.

        Ask me anything about your business, marketing, sales, customers, pricing, or business ideas.
      </div>

    </div>

    <div class="input-area">
      <input
        id="messageInput"
        type="text"
        placeholder="Ask BizAI something..."
        onkeydown="handleKey(event)"
      >

      <button id="sendButton" onclick="sendMessage()">
        Send
      </button>
    </div>

  </div>

  <script>
    async function sendMessage() {

      const input = document.getElementById("messageInput");
      const button = document.getElementById("sendButton");
      const chat = document.getElementById("chat");

      const message = input.value.trim();

      if (!message) {
        return;
      }

      const userMessage = document.createElement("div");
      userMessage.className = "message user";
      userMessage.innerText = message;

      chat.appendChild(userMessage);

      input.value = "";
      button.disabled = true;
      button.innerText = "Thinking...";

      chat.scrollTop = chat.scrollHeight;

      try {

        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: message
          })
        });

        const data = await response.json();

        const aiMessage = document.createElement("div");
        aiMessage.className = "message ai";

        if (data.reply) {
          aiMessage.innerText = data.reply;
        } else {
          aiMessage.innerText = "Sorry, I could not get a response.";
        }

        chat.appendChild(aiMessage);

      } catch (error) {

        const errorMessage = document.createElement("div");
        errorMessage.className = "message ai";
        errorMessage.innerText =
          "Connection error. Please make sure the BizAI server is running.";

        chat.appendChild(errorMessage);

      }

      button.disabled = false;
      button.innerText = "Send";

      chat.scrollTop = chat.scrollHeight;
    }

    function handleKey(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    }
  </script>

</body>
</html>
