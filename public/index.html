
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visionta AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;color:#202123}
button,textarea,select{font:inherit}
.app{display:flex;height:100dvh}
aside{width:255px;background:#f7f7f8;padding:15px;display:flex;flex-direction:column}
.brand{font-size:23px;font-weight:bold;padding:10px 5px 25px}
.brand span{color:#10a37f}
button{cursor:pointer}
.side{width:100%;text-align:left;padding:12px;border:0;background:transparent;border-radius:9px}
.side:hover,.suggest:hover{background:#e9e9e9}
.history{flex:1;overflow:auto;margin-top:15px}
.chatname{display:flex;align-items:center}
.chatname button:first-child{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{flex:1;min-width:0;display:flex;flex-direction:column}
header{height:55px;padding:10px 18px;display:flex;align-items:center;gap:12px}
#menu{display:none}
#scroll{flex:1;overflow:auto;padding:20px}
#welcome{max-width:650px;margin:70px auto 30px;text-align:center}
h1{font-size:32px}
.suggestions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.suggest{background:white;border:1px solid #ddd;border-radius:12px;padding:15px;text-align:left}
.suggest b,.suggest span{display:block;margin-bottom:6px}
.suggest span{font-size:12px;color:#777}
.messages{max-width:780px;margin:auto}
.msg{display:flex;gap:12px;margin:25px 0;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}
.avatar{background:#10a37f;color:white;border-radius:50%;width:30px;height:30px;flex-shrink:0;display:grid;place-items:center}
.msgbody{flex:1;min-width:0}
.msg img{max-width:100%;max-height:350px;display:block;border-radius:12px;margin-bottom:10px}
.composer-area{padding:10px 18px 14px}
.composer{max-width:780px;margin:auto;border:1px solid #ddd;border-radius:24px;padding:10px}
textarea{width:100%;border:0;outline:0;resize:none;max-height:150px;font-size:16px;padding:5px}
.controls{display:flex;align-items:center;gap:6px}
.controls button{border:0;background:transparent;border-radius:50%;width:36px;height:36px}
.controls button:hover{background:#eee}
.controls select{max-width:145px;border:0;color:#777}
#send{margin-left:auto;background:#202123;color:white;font-size:20px}
#send:disabled{opacity:.4}
#preview{display:none;max-width:780px;margin:0 auto 8px;align-items:center;gap:10px}
#preview img{width:60px;height:60px;object-fit:cover;border-radius:8px}
#preview span{flex:1}
.note{text-align:center;color:#888;font-size:11px;margin-top:8px}
.overlay{display:none}
@media(max-width:700px){
aside{position:fixed;z-index:5;inset:0 auto 0 0;transform:translateX(-110%);transition:.2s}
aside.open{transform:translateX(0)}
#menu{display:inline-block}
.overlay.show{display:block;position:fixed;inset:0;background:#0005;z-index:4}
#scroll{padding:12px}
#welcome{margin:35px auto 20px}
h1{font-size:27px}
.composer-area{padding:8px}
.suggestions{gap:7px}
.suggest{padding:11px}
}
</style>
</head>
<body>
<div class="overlay" id="overlay"></div>
<div class="app">
<aside id="sidebar">
<div class="brand">Visionta <span>AI</span></div>
<button class="side" id="new">＋ New chat</button>
<button class="side" id="search">⌕ Search chats</button>
<p style="font-size:12px;color:#777">Explore</p>
<button class="side topicbtn" data-topic="Images">▧ Images</button>
<button class="side topicbtn" data-topic="Study & Learning">▤ Study & Learning</button>
<button class="side topicbtn" data-topic="Writing & Translation">✎ Writing & Translation</button>
<button class="side topicbtn" data-topic="Everyday Help">◉ Everyday Help</button>
<button class="side topicbtn" data-topic="Business Advisor">▦ Business Advisor</button>
<p style="font-size:12px;color:#777">Recent chats</p>
<div class="history" id="history"></div>
<div style="border-top:1px solid #ddd;padding:15px 5px">● Visionta AI</div>
</aside>
<main>
<header>
<button id="menu" style="border:0;background:white;font-size:22px">☰</button>
<strong>Visionta AI</strong>
</header>
<div id="scroll">
<div id="welcome">
<h1>What can I help with?</h1>
<p style="color:#777">Ask anything. Let's work through it together.</p>
<div class="suggestions">
<button class="suggest" data-prompt="Help me brainstorm creative ideas."><b>✦ Brainstorm ideas</b><span>Explore new possibilities</span></button>
<button class="suggest" data-prompt="Explain this topic step by step."><b>▤ Learn something</b><span>Understand a difficult topic</span></button>
<button class="suggest" data-prompt="Help me write a professional message."><b>✎ Write something</b><span>Draft or improve text</span></button>
<button class="suggest" data-prompt="Give me a business idea and practical plan."><b>↗ Business ideas</b><span>Plan your next steps</span></button>
</div>
</div>
<div class="messages" id="messages"></div>
</div>
<div class="composer-area">
<div id="preview"><img id="previewImg" alt="Preview"><span>Image ready</span><button id="remove">✕</button></div>
<div class="composer">
<textarea id="input" rows="1" placeholder="Message Visionta AI"></textarea>
<div class="controls">
<button id="attach" title="Add image">＋</button>
<input type="file" id="file" accept="image/jpeg,image/png,image/webp" hidden>
<button id="camera" title="Camera">▣</button>
<input type="file" id="cameraFile" accept="image/*" capture="environment" hidden>
<button id="voice" title="Voice typing">🎙</button>
<select id="topic">
<option>Everyday Help</option><option>Images</option><option>Study & Learning</option><option>Writing & Translation</option><option>Business Advisor</option>
</select>
<button id="send" disabled>↑</button>
</div>
</div>
<div class="note">Visionta AI can make mistakes. Check important information.</div>
</div>
</main>
</div>
<script>
const $=id=>document.getElementById(id);
let chats=[],active=null,pending=null,busy=false,recognition=null;
const KEY="visionta_history_v1";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function current(){return chats.find(c=>c.id===active)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(chats.slice(0,20)))}catch(e){chats.forEach(c=>c.messages.forEach(m=>delete m.imageBase64));try{localStorage.setItem(KEY,JSON.stringify(chats.slice(0,10)))}catch{}}}
function newChat(topic="Everyday Help"){let c={id:uid(),title:"New chat",topic,messages:[],updatedAt:Date.now()};chats.unshift(c);active=c.id;clearImage();$("topic").value=topic;save();render();closeMenu()}
function renderHistory(filter=""){let box=$("history");box.replaceChildren();chats.filter(c=>(c.title+" "+c.messages.map(m=>m.text).join(" ")).toLowerCase().includes(filter.toLowerCase())).forEach(c=>{let row=document.createElement("div");row.className="chatname";let b=document.createElement("button");b.className="side";b.textContent=c.title;b.onclick=()=>{active=c.id;clearImage();$("topic").value=c.topic;render();closeMenu()};let d=document.createElement("button");d.textContent="×";d.style.border="0";d.onclick=()=>{chats=chats.filter(x=>x.id!==c.id);if(active===c.id)active=chats[0]?.id||null;save();render()};row.append(b,d);box.append(row)})}
function render(){renderHistory();let c=current();$("welcome").style.display=c&&c.messages.length?"none":"block";let box=$("messages");box.replaceChildren();if(!c)return;c.messages.forEach(m=>{let row=document.createElement("div");row.className="msg";let av=document.createElement("div");av.className="avatar";av.textContent=m.role==="user"?"Y":"V";let body=document.createElement("div");body.className="msgbody";if(m.imageUrl){let im=document.createElement("img");im.src=m.imageUrl;im.alt="Uploaded image";body.append(im)}let t=document.createElement("div");t.textContent=m.text||"";body.append(t);if(m.role==="assistant"){let cp=document.createElement("button");cp.textContent="Copy";cp.style.cssText="margin-top:8px;border:0;background:white;color:#777";cp.onclick=()=>navigator.clipboard?.writeText(m.text);body.append(cp)}row.append(av,body);box.append(row)});if(busy){let r=document.createElement("div");r.className="msg";r.textContent="Visionta AI is thinking…";box.append(r)}$("scroll").scrollTop=$("scroll").scrollHeight}
function update(){ $("send").disabled=busy||(!$("input").value.trim()&&!pending)}
function clearImage(){pending=null;$("file").value="";$("cameraFile").value="";$("preview").style.display="none";update()}
async function prepareImage(file){if(!file)return;try{if(!["image/jpeg","image/png","image/webp"].includes(file.type))throw Error("Use JPG, PNG or WEBP.");let src=await new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(file)});let im=new Image();await new Promise((ok,no)=>{im.onload=ok;im.onerror=no;im.src=src});let scale=Math.min(1,1000/Math.max(im.width,im.height)),cv=document.createElement("canvas");cv.width=im.width*scale;cv.height=im.height*scale;cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);let dataUrl=cv.toDataURL("image/jpeg",.7),base64=dataUrl.split(",")[1];if(base64.length>2600000)throw Error("Image is too large. Choose a smaller image.");pending={dataUrl,base64,mimeType:"image/jpeg"};$("previewImg").src=dataUrl;$("preview").style.display="flex";update()}catch(e){clearImage();alert(e.message)}}
async function send(){if(busy)return;let text=$("input").value.trim(),img=pending;if(!text&&!img)return;if(!current())newChat($("topic").value);let c=current(),topic=$("topic").value;let prev=[...c.messages].reverse().find(m=>m.role==="user"&&m.imageBase64);let used=img||(prev?{base64:prev.imageBase64,mimeType:prev.mimeType}:null);$("input").value="";$("input").style.height="auto";clearImage();c.messages.push({role:"user",text,imageUrl:img?.dataUrl||null,imageBase64:img?.base64||null,mimeType:img?.mimeType||null});if(c.title==="New chat")c.title=(text||"Image conversation").slice(0,40);c.topic=topic;save();busy=true;update();render();
try{let history=c.messages.slice(0,-1).slice(-10).map(m=>({role:m.role,text:m.text||"",imageBase64:m.imageBase64||null,mimeType:m.mimeType||"image/jpeg"}));let r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:text,topic,history,image:used?.base64||null,mimeType:used?.mimeType||"image/jpeg"})});let d=await r.json();if(!r.ok)throw Error(d.error||"Request failed "+r.status);let answer=d.reply||d.response||d.text||d.message;if(!answer)throw Error("No answer returned.");c.messages.push({role:"assistant",text:String(answer)})}catch(e){c.messages.push({role:"assistant",text:"I couldn't complete that request.\n\n"+e.message})}finally{busy=false;c.updatedAt=Date.now();save();render();update()}}
$("new").onclick=()=>newChat();$("attach").onclick=()=>$("file").click();$("camera").onclick=()=>$("cameraFile").click();$("file").onchange=e=>prepareImage(e.target.files[0]);$("cameraFile").onchange=e=>prepareImage(e.target.files[0]);$("remove").onclick=clearImage;$("send").onclick=send;$("input").oninput=()=>{let t=$("input");t.style.height="auto";t.style.height=Math.min(t.scrollHeight,150)+"px";update()};$("input").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};$("menu").onclick=()=>{$("sidebar").classList.add("open");$("overlay").classList.add("show")};function closeMenu(){$("sidebar").classList.remove("open");$("overlay").classList.remove("show")}$("overlay").onclick=closeMenu;
document.querySelectorAll(".suggest").forEach(b=>b.onclick=()=>{$("input").value=b.dataset.prompt;update();$("input").focus()});document.querySelectorAll(".topicbtn").forEach(b=>b.onclick=()=>newChat(b.dataset.topic));$("search").onclick=()=>{let q=prompt("Search chats");if(q!==null)renderHistory(q)};$("voice").onclick=()=>{let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return alert("Try Chrome or Edge for voice typing.");if(recognition){recognition.stop();return}recognition=new SR();recognition.lang=navigator.language||"en-US";recognition.onresult=e=>{$("input").value=e.results[0][0].transcript;update()};recognition.onend=()=>recognition=null;recognition.start()};
try{chats=JSON.parse(localStorage.getItem(KEY)||"[]")}catch{chats=[]}if(!Array.isArray(chats))chats=[];if(!chats.length)newChat();else{active=chats[0].id;render()}update();
</script>
</body>
</html>
