
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bizvanta AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#202123;background:#fff;height:100vh;overflow:hidden}
button,textarea,input,select{font:inherit}
button{cursor:pointer}
.app{display:flex;height:100vh;height:100dvh}
.sidebar{width:260px;flex-shrink:0;background:#f7f7f8;padding:12px;display:flex;flex-direction:column;gap:12px;border-right:1px solid #eee}
.brand{font-size:20px;font-weight:700;padding:8px 10px}
.brand span{color:#00a884}
.side-btn{width:100%;padding:12px;border:1px solid #e0e0e0;border-radius:12px;background:white;text-align:left}
.topic-btn,.history-btn{width:100%;border:0;background:transparent;text-align:left;padding:11px 10px;border-radius:8px}
.topic-btn:hover,.history-btn:hover{background:#eceef0}
.topic-btn.active{background:#e8f5f1}
.section-label{font-size:12px;color:#777;padding:5px 8px}
.topics{display:grid;gap:2px}
.history{overflow:auto}
.sidebar-bottom{margin-top:auto;border-top:1px solid #ddd;padding:12px 4px;font-size:12px;color:#555}
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%;min-height:0}
.topbar{height:46px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.chat-scroll{flex:1;min-height:0;overflow-y:auto;padding:15px 20px}
.welcome{max-width:790px;margin:12vh auto 0;text-align:center}
.welcome h1{font-size:30px;margin:0 0 15px}
.welcome p{color:#777;margin:0}
.suggestions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:24px}
.suggestion{min-height:94px;background:#fff;border:1px solid #e0e0e0;border-radius:15px;text-align:left;padding:14px;font-size:14px}
.suggestion:hover{background:#fafafa}
.suggestion small{display:inline-block;color:#777;margin-top:8px}
.messages{max-width:800px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.message{display:flex;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.message.user{justify-content:flex-end}
.bubble{max-width:88%;padding:12px 15px;border-radius:17px}
.message.user .bubble{background:#f1f1f1}
.message.assistant .bubble{padding-left:0}
.message-photo{display:block;max-width:min(100%,320px);max-height:320px;object-fit:contain;border-radius:12px;margin-top:8px}
.composer-wrap{flex-shrink:0;padding:8px 20px 14px;background:white;padding-bottom:max(14px,env(safe-area-inset-bottom))}
.composer{max-width:790px;margin:auto;position:relative;border:1px solid #dadce0;border-radius:28px;padding:8px 10px;display:flex;align-items:flex-end;gap:8px;box-shadow:0 2px 8px #00000008}
#messageInput{flex:1;min-width:0;resize:none;border:0;outline:0;max-height:150px;min-height:34px;padding:8px 3px;line-height:1.5}
.icon-btn{width:38px;height:38px;flex-shrink:0;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;color:#333}
.icon-btn:hover{background:#eee}
.send{background:#d6d6da;color:white}
.send:disabled{opacity:.45;cursor:wait}
.mic.listening{background:#fee2e2;color:#b91c1c}
.status{text-align:center;min-height:17px;font-size:12px;color:#777;margin-top:5px;overflow-wrap:anywhere}
.note{text-align:center;color:#999;font-size:11px;margin-top:5px}
#attachmentMenu{position:absolute;bottom:58px;left:10px;display:none;background:white;border:1px solid #ddd;border-radius:13px;padding:7px;box-shadow:0 5px 20px #0002;z-index:10;width:180px}
#attachmentMenu button{display:block;width:100%;border:0;background:white;text-align:left;padding:11px;border-radius:8px}
#attachmentMenu button:hover{background:#f1f1f1}
#preview{display:none;max-width:790px;margin:0 auto 8px;align-items:center;gap:10px;font-size:12px;color:#555}
#preview img{width:50px;height:50px;object-fit:cover;border-radius:8px}
#preview button{border:0;background:#eee;border-radius:50%;width:26px;height:26px}
@media(max-width:700px){
.sidebar{display:none}
.welcome{margin-top:8vh}
.welcome h1{font-size:27px}
.suggestions{grid-template-columns:1fr}
.composer-wrap{padding:8px 8px max(10px,env(safe-area-inset-bottom))}
.chat-scroll{padding:12px}
.topbar{padding:0 12px}
#speechLanguage{max-width:64px!important}
.composer{gap:3px;padding:6px}
.icon-btn{width:34px;height:36px}
#messageInput{font-size:16px}
.bubble{max-width:94%}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">Bizvanta <span>AI</span></div>
    <button class="side-btn" id="newChat">＋ &nbsp; New chat</button>
    <div class="topics">
      <button class="topic-btn" data-topic="Images">▧ &nbsp; Images</button>
      <button class="topic-btn" data-topic="Study & Learning">▤ &nbsp; Study &amp; Learning</button>
      <button class="topic-btn" data-topic="Health & Medicine">✚ &nbsp; Health &amp; Medicine</button>
      <button class="topic-btn" data-topic="Everyday Help">◉ &nbsp; Everyday Help</button>
      <button class="topic-btn" data-topic="Writing & Translation">✎ &nbsp; Writing &amp; Translation</button>
      <button class="topic-btn" data-topic="Planning">▦ &nbsp; Planning</button>
      <button class="topic-btn" data-topic="Business Ideas">◇ &nbsp; Business Ideas</button>
      <button class="topic-btn" data-topic="Business Advisor">▥ &nbsp; Business Advisor</button>
      <button class="topic-btn" data-topic="Marketing & Sales">↗ &nbsp; Marketing &amp; Sales</button>
    </div>
    <div>
      <div class="section-label">Recent chats</div>
      <div class="history" id="history"></div>
    </div>
    <div class="sidebar-bottom"><b>Bizvanta AI</b><br>Your business assistant</div>
  </aside>

  <main class="main">
    <div class="topbar">
      <b>Bizvanta AI⌄</b>
      <button class="icon-btn" id="topNewChat" title="New chat">✎</button>
    </div>

    <div class="chat-scroll" id="chatScroll">
      <section class="welcome" id="welcome">
        <h1>Ready when you are.</h1>
        <p>What would you like to work on today?</p>
        <div class="suggestions">
          <button class="suggestion" data-prompt="Help me create an image or sticker.">▧<br><b>Create an image or sticker</b><br><small>Turn an idea into a visual concept</small></button>
          <button class="suggestion" data-prompt="Help me write or edit this text.">✎<br><b>Write or edit</b><br><small>Draft, rewrite, or improve text</small></button>
          <button class="suggestion" data-prompt="Research a topic and explain it clearly.">⌕<br><b>Research a topic</b><br><small>Explore a business idea</small></button>
        </div>
      </section>
      <section class="messages" id="messages"></section>
    </div>

    <div class="composer-wrap">
      <div id="preview">
        <img id="previewImage" alt="Selected image">
        <span id="previewName"></span>
        <button type="button" id="removeImage" title="Remove image">×</button>
      </div>

      <form class="composer" id="chatForm">
        <div id="attachmentMenu">
          <button type="button" id="cameraOption">📷 &nbsp; Camera</button>
          <button type="button" id="uploadOption">▧ &nbsp; Upload image</button>
        </div>
        <button type="button" class="icon-btn" id="plusBtn" title="Add photo" aria-label="Add photo">＋</button>
        <textarea id="messageInput" rows="1" placeholder="Message Bizvanta AI..." aria-label="Message Bizvanta AI"></textarea>
        <select id="speechLanguage" title="Voice language" style="max-width:75px;border:0;background:transparent;color:#666;font-size:11px;outline:0">
          <option value="ur-PK">Urdu</option>
          <option value="en-US">English</option>
        </select>
        <button type="button" class="icon-btn mic" id="micBtn" title="Voice typing" aria-label="Voice typing">🎙</button>
        <button type="submit" class="icon-btn send" id="sendBtn" title="Send" aria-label="Send">↑</button>
      </form>

      <input type="file" id="uploadInput" accept="image/*" hidden>
      <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
      <div class="status" id="status" role="status" aria-live="polite"></div>
      <div class="note">Bizvanta AI can make mistakes. Check important information.</div>
    </div>
  </main>
</div>

<script>
const input = document.getElementById('messageInput');
const form = document.getElementById('chatForm');
const messagesEl = document.getElementById('messages');
const welcome = document.getElementById('welcome');
const statusEl = document.getElementById('status');
const sendBtn = document.getElementById('sendBtn');
const micBtn = document.getElementById('micBtn');
const language = document.getElementById('speechLanguage');
const attachmentMenu = document.getElementById('attachmentMenu');
const uploadInput = document.getElementById('uploadInput');
const cameraInput = document.getElementById('cameraInput');
const preview = document.getElementById('preview');

const STORAGE_KEY = 'bizvanta_chat_history_v2';
let chats = loadChats();
let activeChatId = null;
let currentTopic = '';
let selectedImage = null;
let recognition = null;
let wantsListening = false;
let restartTimer = null;

function loadChats() {
  try {
    const value = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    return Array.isArray(value) ? value : [];
  } catch (e) {
    return [];
  }
}

function saveChats() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
  } catch (e) {
    setStatus('Browser storage is full. Older chat history may not save.');
  }
}

function setStatus(text) {
  statusEl.textContent = text || '';
}

function makeId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

function autoResize() {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 150) + 'px';
}
input.addEventListener('input', autoResize);

function newChat() {
  stopRecognition();
  activeChatId = null;
  currentTopic = '';
  selectedImage = null;
  preview.style.display = 'none';
  uploadInput.value = '';
  cameraInput.value = '';
  document.getElementById('previewImage').removeAttribute('src');
  messagesEl.replaceChildren();
  welcome.hidden = false;
  input.value = '';
  input.placeholder = 'Message Bizvanta AI...';
  autoResize();
  setStatus('');
  document.querySelectorAll('.topic-btn').forEach(b => b.classList.remove('active'));
  renderHistory();
}

document.getElementById('newChat').addEventListener('click', newChat);
document.getElementById('topNewChat').addEventListener('click', newChat);

document.querySelectorAll('.topic-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    newChat();
    currentTopic = btn.dataset.topic;
    btn.classList.add('active');
    input.placeholder = 'Ask about ' + currentTopic + '...';
    input.focus();
  });
});

document.querySelectorAll('.suggestion').forEach(btn => {
  btn.addEventListener('click', () => {
    input.value = btn.dataset.prompt || '';
    autoResize();
    input.focus();
  });
});

document.getElementById('plusBtn').addEventListener('click', () => {
  attachmentMenu.style.display =
    attachmentMenu.style.display === 'block' ? 'none' : 'block';
});

document.getElementById('cameraOption').addEventListener('click', () => {
  attachmentMenu.style.display = 'none';
  cameraInput.click();
});

document.getElementById('uploadOption').addEventListener('click', () => {
  attachmentMenu.style.display = 'none';
  uploadInput.click();
});

function handleImage(file) {
  if (!file) return;

  if (!file.type.startsWith('image/')) {
    setStatus('Please choose a valid image file.');
    return;
  }

  if (file.size > 25 * 1024 * 1024) {
    setStatus('This image is too large to process in the browser. Please choose a smaller photo.');
    return;
  }

  selectedImage = file;
  const reader = new FileReader();

  reader.onload = () => {
    document.getElementById('previewImage').src = reader.result;
    document.getElementById('previewName').textContent =
      file.name || 'Camera photo selected';
    preview.style.display = 'flex';
    setStatus('Image attached. Press Send when ready.');
  };

  reader.onerror = () => setStatus('Could not read this image. Please try another.');
  reader.readAsDataURL(file);
}

uploadInput.addEventListener('change', () => handleImage(uploadInput.files[0]));
cameraInput.addEventListener('change', () => handleImage(cameraInput.files[0]));

document.getElementById('removeImage').addEventListener('click', () => {
  selectedImage = null;
  uploadInput.value = '';
  cameraInput.value = '';
  preview.style.display = 'none';
  document.getElementById('previewImage').removeAttribute('src');
  setStatus('');
});

function renderHistory() {
  const list = document.getElementById('history');
  list.replaceChildren();

  chats.slice()
    .sort((a,b) => b.updatedAt - a.updatedAt)
    .slice(0,30)
    .forEach(chat => {
      const btn = document.createElement('button');
      btn.className = 'history-btn';
      btn.textContent = '◷ ' + (chat.title || 'New chat');
      btn.title = btn.textContent;
      btn.addEventListener('click', () => openChat(chat.id));
      list.appendChild(btn);
    });
}

function ensureChat(firstMessage) {
  if (activeChatId) {
    const existing = chats.find(c => c.id === activeChatId);
    if (existing) return existing;
  }

  const chat = {
    id: makeId(),
    title: (firstMessage || 'New chat').slice(0,42),
    topic: currentTopic,
    messages: [],
    updatedAt: Date.now()
  };

  chats.push(chat);
  activeChatId = chat.id;
  saveChats();
  renderHistory();
  return chat;
}

function addMessage(role, text, imageUrl) {
  const row = document.createElement('div');
  row.className = 'message ' + role;

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = String(text ?? '');

  if (imageUrl) {
    const img = document.createElement('img');
    img.className = 'message-photo';
    img.src = imageUrl;
    img.alt = 'Uploaded image';
    img.loading = 'lazy';
    bubble.appendChild(img);
  }

  row.appendChild(bubble);
  messagesEl.appendChild(row);

  const sc = document.getElementById('chatScroll');
  sc.scrollTop = sc.scrollHeight;
  return row;
}

function openChat(id) {
  stopRecognition();
  const chat = chats.find(c => c.id === id);
  if (!chat) return;

  activeChatId = id;
  currentTopic = chat.topic || '';
  welcome.hidden = true;
  messagesEl.replaceChildren();

  chat.messages.forEach(m => addMessage(m.role, m.text));

  document.querySelectorAll('.topic-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.topic === currentTopic);
  });

  input.placeholder = currentTopic
    ? 'Ask about ' + currentTopic + '...'
    : 'Message Bizvanta AI...';
  setStatus('');
}

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.onerror = () => reject(new Error('Could not read the image.'));
    reader.onload = () => {
      const img = new Image();

      img.onerror = () => reject(new Error('Could not open this image.'));
      img.onload = () => {
        const maxDimension = 1400;
        const scale = Math.min(
          1,
          maxDimension / Math.max(img.naturalWidth, img.naturalHeight)
        );

        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
        canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));

        const ctx = canvas.getContext('2d');
        if (!ctx) {
          reject(new Error('Image processing is not supported by this browser.'));
          return;
        }

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        canvas.toBlob(blob => {
          if (!blob) {
            reject(new Error('Could not compress image. Please try another photo.'));
            return;
          }

          resolve({
            blob,
            dataUrl: canvas.toDataURL('image/jpeg', 0.84),
            mimeType: 'image/jpeg'
          });
        }, 'image/jpeg', 0.84);
      };

      img.src = reader.result;
    };

    reader.readAsDataURL(file);
  });
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
    reader.onerror = () => reject(new Error('Could not prepare image for sending.'));
    reader.readAsDataURL(file);
  });
}

function imageInstructions() {
  return [
    'Analyze the attached image carefully.',
    'If it contains a prescription, handwritten note, receipt, document or simple text, transcribe the visible text as accurately as possible.',
    'Preserve medicine names, numbers, units, dates and instructions exactly as written.',
    'Separate clearly readable text from uncertain text. Mark uncertain words as [unclear] instead of guessing.',
    'For prescriptions, never invent or infer an uncertain medicine name, dose, frequency or duration. Tell the user to confirm unclear medical instructions with a pharmacist or prescribing clinician.',
    'If the image is a normal photo, describe what is visible.',
    'Explain the result clearly and state any limitations.'
  ].join(' ');
}

async function sendMessage() {
  const message = input.value.trim();

  if ((!message && !selectedImage) || sendBtn.disabled) return;

  stopRecognition();
  attachmentMenu.style.display = 'none';

  const imageFile = selectedImage;
  const chat = ensureChat(message || 'Image question');

  const userMessage = currentTopic
    ? '[' + currentTopic + '] ' + message
    : message;

  const displayText =
    (message ? message + '\n' : '') +
    (imageFile ? '[Image attached: ' + (imageFile.name || 'Photo') + ']' : '');

  chat.messages.push({
    role: 'user',
    text: displayText || 'Image attached'
  });

  chat.updatedAt = Date.now();

  if (chat.messages.filter(m => m.role === 'user').length === 1) {
    chat.title = (message || 'Image question').slice(0,42);
  }

  saveChats();
  renderHistory();
  welcome.hidden = true;

  const imageUrlForChat = imageFile ? URL.createObjectURL(imageFile) : null;
  addMessage('user', displayText || 'Image attached', imageUrlForChat);

  input.value = '';
  autoResize();

  selectedImage = null;
  uploadInput.value = '';
  cameraInput.value = '';
  preview.style.display = 'none';
  document.getElementById('previewImage').removeAttribute('src');

  sendBtn.disabled = true;
  setStatus('Preparing your message...');
  const waiting = addMessage('assistant', 'Thinking...');

  try {
    let imageData = null;
    let mimeType = null;

    if (imageFile) {
      setStatus('Making the image smaller for mobile and laptop...');
      const processed = await loadImage(imageFile);
      imageData = await fileToBase64(processed.blob);
      mimeType = processed.mimeType;
    }

    const finalMessage = imageFile
      ? (userMessage || 'Please describe this image.') + '\n\n' + imageInstructions()
      : userMessage;

    setStatus('Bizvanta AI is thinking...');

    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        message: finalMessage || 'Hello',
        image: imageData,
        mimeType,
        topic: currentTopic
      })
    });

    const data = await response.json().catch(() => ({}));

    if (!response.ok) {
      if (response.status === 413) {
        throw new Error('Image request is still too large for the backend. The /api/chat server limit must also be checked.');
      }

      if (response.status === 503) {
        throw new Error('The AI service is temporarily unavailable or busy. Please try again shortly.');
      }

      if (response.status === 429) {
        throw new Error('The AI service quota or rate limit may have been reached. Please check your API usage.');
      }

      throw new Error(
        data.error || data.message || ('Request failed (' + response.status + ').')
      );
    }

    const answer =
      data.reply ??
      data.response ??
      data.text ??
      data.message ??
      (typeof data === 'string' ? data : '');

    if (!answer) {
      throw new Error('The server returned an empty response. Check the backend logs.');
    }

    waiting.querySelector('.bubble').textContent = String(answer);
    chat.messages.push({role:'assistant', text:String(answer)});
    chat.updatedAt = Date.now();
    saveChats();
    renderHistory();
    setStatus('');

  } catch (error) {
    const details = error && error.message
      ? error.message
      : 'Unknown error. Please try again.';

    waiting.querySelector('.bubble').textContent =
      'Message send nahi ho saka.\n\n' + details;

    setStatus(details);
  } finally {
    sendBtn.disabled = false;
  }
}

form.addEventListener('submit', event => {
  event.preventDefault();
  sendMessage();
});

input.addEventListener('keydown', event => {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    form.requestSubmit();
  }
});

/* Voice typing with automatic restart when supported by the browser. */
function stopRecognition() {
  wantsListening = false;

  if (restartTimer) {
    clearTimeout(restartTimer);
    restartTimer = null;
  }

  const old = recognition;
  recognition = null;
  micBtn.classList.remove('listening');
  micBtn.title = 'Voice typing';
  micBtn.setAttribute('aria-label', 'Voice typing');

  if (old) {
    old.onend = null;
    try { old.stop(); } catch (e) {}
  }
}

function startRecognition() {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    wantsListening = false;
    setStatus('Voice typing is not supported in this browser. Try Chrome.');
    return;
  }

  if (!wantsListening) return;

  const rec = new SpeechRecognition();
  recognition = rec;
  rec.lang = language.value;
  rec.continuous = true;
  rec.interimResults = true;
  rec.maxAlternatives = 1;

  let finalText = '';
  const baseText = input.value.trim()
    ? input.value.trim() + ' '
    : '';

  rec.onstart = () => {
    if (recognition !== rec) return;
    micBtn.classList.add('listening');
    micBtn.title = 'Listening — click to stop';
    micBtn.setAttribute('aria-label', 'Stop voice typing');
    setStatus('Listening... Tap the mic again to stop.');
  };

  rec.onresult = event => {
    if (recognition !== rec) return;
    let interim = '';

    for (let i = event.resultIndex; i < event.results.length; i++) {
      const transcript = event.results[i][0].transcript;
      if (event.results[i].isFinal) {
        finalText += transcript.trim() + ' ';
      } else {
        interim += transcript;
      }
    }

    input.value = baseText + finalText + interim;
    autoResize();
  };

  rec.onerror = event => {
    if (recognition !== rec) return;

    if (event.error === 'not-allowed' ||
        event.error === 'service-not-allowed') {
      wantsListening = false;
      setStatus('Microphone permission is blocked. Allow it in browser settings.');
    } else if (event.error === 'audio-capture') {
      wantsListening = false;
      setStatus('No microphone detected. Check your microphone.');
    } else if (event.error === 'network') {
      setStatus('Speech recognition network error. Check your internet.');
    }
  };

  rec.onend = () => {
    if (recognition !== rec) return;

    micBtn.classList.remove('listening');

    if (wantsListening) {
      setStatus('Restarting microphone...');
      recognition = null;

      restartTimer = setTimeout(() => {
        restartTimer = null;
        if (wantsListening) startRecognition();
      }, 700);
    } else {
      recognition = null;
      micBtn.title = 'Voice typing';
      micBtn.setAttribute('aria-label', 'Voice typing');
      setStatus(finalText.trim() ? 'Voice text ready. Review and press Send.' : '');
    }
  };

  try {
    rec.start();
  } catch (e) {
    if (recognition === rec) recognition = null;

    restartTimer = setTimeout(() => {
      restartTimer = null;
      if (wantsListening) startRecognition();
    }, 1000);
  }
}

micBtn.addEventListener('click', () => {
  if (wantsListening) {
    stopRecognition();
    setStatus('Voice typing stopped. Review your text and press Send.');
  } else {
    wantsListening = true;
    startRecognition();
  }
});

language.addEventListener('change', () => {
  if (wantsListening) {
    stopRecognition();
    wantsListening = true;
    startRecognition();
  }
});

document.addEventListener('click', event => {
  if (!attachmentMenu.contains(event.target) &&
      event.target.id !== 'plusBtn') {
    attachmentMenu.style.display = 'none';
  }
});

renderHistory();
</script>
</body>
</html>
