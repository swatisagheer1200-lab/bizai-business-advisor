
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bizvanta AI</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: #222;
  background: #fff;
}

.app {
  display: flex;
  height: 100vh;
}

.sidebar {
  width: 250px;
  background: #f7f7f8;
  padding: 15px;
  display: flex;
  flex-direction: column;
}

.sidebar h2 { margin: 8px 0 20px; }

.sidebar button {
  display: block;
  width: 100%;
  padding: 12px;
  border: 0;
  background: transparent;
  text-align: left;
  border-radius: 8px;
  cursor: pointer;
}

.sidebar button:hover { background: #e8e8e8; }

.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.topbar {
  padding: 18px;
  border-bottom: 1px solid #eee;
  font-weight: bold;
}

.content {
  flex: 1;
  overflow: auto;
  padding: 20px;
}

.welcome {
  text-align: center;
  margin: 12vh auto 25px;
}

.welcome h1 { font-size: 30px; font-weight: 500; }

.quick-actions {
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
}

.quick-actions button {
  background: white;
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 14px;
  cursor: pointer;
}

.messages {
  max-width: 750px;
  margin: auto;
}

.message {
  padding: 12px 15px;
  margin: 14px 0;
  border-radius: 15px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user {
  background: #f1f1f1;
  margin-left: auto;
  max-width: 85%;
  width: fit-content;
}

.assistant { line-height: 1.6; }

.assistant img {
  max-width: 100%;
  max-height: 300px;
  border-radius: 10px;
}

.composer-area {
  padding: 12px 18px 20px;
}

.composer-wrap {
  max-width: 780px;
  margin: auto;
}

.attachments {
  display: flex;
  gap: 8px;
  margin-bottom: 8px;
}

.preview {
  width: 65px;
  height: 65px;
  object-fit: cover;
  border-radius: 10px;
}

.composer {
  position: relative;
  display: flex;
  align-items: flex-end;
  gap: 7px;
  border: 1px solid #ddd;
  border-radius: 26px;
  padding: 8px;
  background: white;
}

.composer textarea {
  flex: 1;
  min-width: 0;
  resize: none;
  border: 0;
  outline: 0;
  padding: 10px 4px;
  font: inherit;
  max-height: 150px;
}

.icon-button {
  width: 38px;
  height: 38px;
  border: 0;
  border-radius: 50%;
  background: transparent;
  cursor: pointer;
  font-size: 20px;
}

.icon-button:hover { background: #eee; }

.plus-menu {
  display: none;
  position: absolute;
  bottom: 50px;
  left: 5px;
  width: 210px;
  padding: 7px;
  border: 1px solid #ddd;
  border-radius: 12px;
  background: white;
  box-shadow: 0 5px 20px #0002;
  z-index: 5;
}

.plus-menu button {
  width: 100%;
  border: 0;
  background: white;
  padding: 12px;
  text-align: left;
  border-radius: 8px;
  cursor: pointer;
}

.plus-menu button:hover { background: #f1f1f1; }

.send {
  background: #222;
  color: white;
}

.note {
  text-align: center;
  font-size: 11px;
  color: #888;
  margin-top: 8px;
}

.hidden { display: none; }

@media (max-width: 700px) {
  .sidebar { display: none; }
  .welcome h1 { font-size: 25px; }
  .quick-actions { flex-direction: column; }
  .composer-area { padding: 8px 10px 14px; }
}
</style>
</head>

<body>
<div class="app">

  <aside class="sidebar">
    <h2>Bizvanta <span style="color:#10a37f">AI</span></h2>
    <button onclick="newChat()">＋ New chat</button>
    <button onclick="setTopic('Images')">▧ Images</button>
    <button onclick="setTopic('Study & Learning')">▤ Study & Learning</button>
    <button onclick="setTopic('Everyday Help')">◉ Everyday Help</button>
    <button onclick="setTopic('Writing & Translation')">✎ Writing & Translation</button>
    <button onclick="setTopic('Planning')">▦ Planning</button>
    <button onclick="setTopic('Business Ideas')">◇ Business Ideas</button>
    <button onclick="setTopic('Business Advisor')">▥ Business Advisor</button>
    <button onclick="setTopic('Marketing & Sales')">↗ Marketing & Sales</button>
    <p>Recent chats</p>
    <div id="history"></div>
  </aside>

  <main class="main">
    <div class="topbar">Bizvanta AI ⌄</div>

    <section class="content" id="content">
      <div class="welcome" id="welcome">
        <h1>Ready when you are.</h1>
        <p>What would you like to work on today?</p>
      </div>

      <div class="quick-actions" id="quickActions">
        <button onclick="suggest('Help me create an image or sticker.')">
          ▧ Create an image or sticker
        </button>
        <button onclick="suggest('Help me write or edit something.')">
          ✎ Write or edit
        </button>
        <button onclick="suggest('Help me with my business idea.')">
          ◇ Business ideas
        </button>
      </div>

      <div class="messages" id="messages"></div>
    </section>

    <footer class="composer-area">
      <div class="composer-wrap">
        <div class="attachments" id="attachments"></div>

        <div class="composer">
          <button class="icon-button" id="plusButton">＋</button>

          <div class="plus-menu" id="plusMenu">
            <button id="uploadButton">▧ &nbsp; Upload a photo</button>
            <button id="cameraButton">📷 &nbsp; Take a photo</button>
            <button id="fileButton">📎 &nbsp; Upload a file</button>
          </div>

          <textarea id="messageInput" rows="1"
            placeholder="Message Bizvanta AI..."></textarea>

          <button class="icon-button" id="micButton"
            title="Voice typing">🎙</button>

          <button class="icon-button send" id="sendButton"
            title="Send">↑</button>

          <input class="hidden" id="imageInput" type="file" accept="image/*">
          <input class="hidden" id="cameraInput" type="file"
            accept="image/*" capture="environment">
          <input class="hidden" id="fileInput" type="file">
        </div>

        <div class="note">
          Bizvanta AI can make mistakes. Check important information.
        </div>
      </div>
    </footer>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);

let topic = "Business Advisor";
let selectedImage = null;
let chats = [];

try {
  chats = JSON.parse(localStorage.getItem("bizvanta_chats") || "[]");
} catch (e) {}

function setTopic(name) {
  topic = name;
  $("messageInput").placeholder = "Message Bizvanta AI about " + name + "...";
  $("messageInput").focus();
}

function suggest(text) {
  $("messageInput").value = text;
  $("messageInput").focus();
}

function newChat() {
  $("messages").innerHTML = "";
  $("welcome").style.display = "";
  $("quickActions").style.display = "";
  $("messageInput").value = "";
  selectedImage = null;
  $("attachments").innerHTML = "";
}

function saveChat(title, userText, reply) {
  chats.push({ title, userText, reply, time: Date.now() });
  localStorage.setItem("bizvanta_chats", JSON.stringify(chats));
  renderHistory();
}

function renderHistory() {
  const history = $("history");
  history.innerHTML = "";

  chats.slice().reverse().forEach(chat => {
    const button = document.createElement("button");
    button.textContent = "◷ " + chat.title;
    button.onclick = () => {
      $("messages").innerHTML = "";
      $("welcome").style.display = "none";
      $("quickActions").style.display = "none";
      addMessage("user", chat.userText);
      addMessage("assistant", chat.reply);
    };
    history.appendChild(button);
  });
}

function addMessage(role, text, imageUrl = null) {
  $("welcome").style.display = "none";
  $("quickActions").style.display = "none";

  const div = document.createElement("div");
  div.className = "message " + role;

  if (imageUrl) {
    const img = document.createElement("img");
    img.src = imageUrl;
    div.appendChild(img);
  }

  if (text) {
    const p = document.createElement("div");
    p.textContent = text;
    div.appendChild(p);
  }

  $("messages").appendChild(div);
  $("content").scrollTop = $("content").scrollHeight;
}

$("plusButton").onclick = event => {
  event.stopPropagation();
  const menu = $("plusMenu");
  menu.style.display = menu.style.display === "block" ? "none" : "block";
};

$("plusMenu").onclick = event => event.stopPropagation();

document.addEventListener("click", () => {
  $("plusMenu").style.display = "none";
});

$("uploadButton").onclick = () => {
  $("plusMenu").style.display = "none";
  $("imageInput").click();
};

$("cameraButton").onclick = () => {
  $("plusMenu").style.display = "none";
  $("cameraInput").click();
};

$("fileButton").onclick = () => {
  $("plusMenu").style.display = "none";
  $("fileInput").click();
};

function showImage(file) {
  if (!file) return;

  const reader = new FileReader();

  reader.onload = event => {
    selectedImage = event.target.result;
    $("attachments").innerHTML = "";

    const img = document.createElement("img");
    img.className = "preview";
    img.src = selectedImage;

    const remove = document.createElement("button");
    remove.textContent = "×";
    remove.onclick = () => {
      selectedImage = null;
      $("attachments").innerHTML = "";
    };

    $("attachments").append(img, remove);
  };

  reader.readAsDataURL(file);
}

$("imageInput").onchange = e => showImage(e.target.files[0]);
$("cameraInput").onchange = e => showImage(e.target.files[0]);

$("fileInput").onchange = e => {
  const file = e.target.files[0];
  if (file) alert("Selected file: " + file.name);
};

$("sendButton").onclick = async () => {
  const text = $("messageInput").value.trim();

  if (!text && !selectedImage) {
    alert("Please type a message or choose a photo.");
    return;
  }

  const imageToSend = selectedImage;
  addMessage("user", text, imageToSend);

  $("messageInput").value = "";
  selectedImage = null;
  $("attachments").innerHTML = "";

  addMessage("assistant", "Thinking...");

  const all = $("messages").querySelectorAll(".assistant");
  const thinking = all[all.length - 1];

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message: text || "Please examine this image.",
        image: imageToSend ? imageToSend.split(",")[1] : null,
        mimeType: imageToSend ? imageToSend.split(";")[0].split(":")[1] : null,
        topic: topic
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Server error");
    }

    const reply = data.reply || data.response || "No reply received.";
    thinking.textContent = reply;
    saveChat(text || "Image question", text, reply);

  } catch (error) {
    thinking.textContent =
      "Could not connect to the AI backend. Please check your Vercel /api/chat setup. " +
      error.message;
  }
};

$("messageInput").addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    $("sendButton").click();
  }
});

const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;

$("micButton").onclick = () => {
  if (!Speech) {
    alert("Voice typing is not supported in this browser. Try Chrome.");
    return;
  }

  const recognition = new Speech();
  recognition.lang = navigator.language || "en-US";

  recognition.onresult = event => {
    $("messageInput").value = event.results[0][0].transcript;
  };

  recognition.onerror = () => alert("Please allow microphone access.");
  recognition.start();
};

renderHistory();
</script>
</body>
</html>
