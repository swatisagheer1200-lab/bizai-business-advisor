
<!-- Bizvanta AI: Chat input controls -->
<style>
  #bv-attach-menu {
    display: none;
    position: absolute;
    bottom: 55px;
    left: 0;
    background: white;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 8px;
    box-shadow: 0 4px 16px #0002;
    z-index: 9999;
  }
  #bv-attach-menu button {
    display: block;
    width: 150px;
    padding: 10px;
    background: white;
    border: 0;
    text-align: left;
    cursor: pointer;
  }
  #bv-attach-menu button:hover { background: #f3f3f3; }
  #bv-preview { max-width: 180px; max-height: 120px; display: none; }
  #bv-status { font-size: 12px; color: #666; }
</style>

<div id="bv-tools" style="display:flex;align-items:center;gap:10px;position:relative;">
  <button type="button" id="bv-plus" aria-label="Attachments">＋</button>

  <div id="bv-attach-menu">
    <button type="button" id="bv-camera">📷 Camera</button>
    <button type="button" id="bv-upload">📎 Upload file</button>
  </div>

  <input id="bv-file" type="file" accept="image/*,.pdf,.txt,.doc,.docx" hidden>
  <input id="bv-camera-file" type="file" accept="image/*" capture="environment" hidden>

  <button type="button" id="bv-mic" aria-label="Voice input">🎙</button>
  <button type="button" id="bv-send">➤ Send</button>
  <button type="button" id="bv-speak" aria-label="Read answer aloud">🔊</button>
</div>

<img id="bv-preview" alt="Selected image preview">
<div id="bv-status" role="status"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  let selectedFile = null;

  $('bv-plus').onclick = () => {
    const menu = $('bv-attach-menu');
    menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
  };

  $('bv-camera').onclick = () => {
    $('bv-attach-menu').style.display = 'none';
    $('bv-camera-file').click();
  };

  $('bv-upload').onclick = () => {
    $('bv-attach-menu').style.display = 'none';
    $('bv-file').click();
  };

  function chooseFile(file) {
    if (!file) return;
    selectedFile = file;
    const preview = $('bv-preview');
    if (file.type.startsWith('image/')) {
      preview.src = URL.createObjectURL(file);
      preview.style.display = 'block';
    } else {
      preview.style.display = 'none';
    }
    $('bv-status').textContent = 'Selected: ' + file.name;
  }

  $('bv-file').onchange = e => chooseFile(e.target.files[0]);
  $('bv-camera-file').onchange = e => chooseFile(e.target.files[0]);

  // Voice input: supported in Chrome and some other browsers.
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  $('bv-mic').onclick = () => {
    if (!SpeechRecognition) {
      $('bv-status').textContent =
        'Voice typing is not supported in this browser.';
      return;
    }

    const recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.interimResults = false;

    recognition.onresult = event => {
      const spoken = event.results[0][0].transcript;
      const input = document.querySelector(
        '#message-input, #message, textarea, input[type="text"]'
      );
      if (input) {
        input.value = (input.value ? input.value + ' ' : '') + spoken;
        input.dispatchEvent(new Event('input', { bubbles: true }));
      } else {
        $('bv-status').textContent = 'Voice: ' + spoken;
      }
    };

    recognition.onerror = () => {
      $('bv-status').textContent = 'Mic error. Check microphone permission.';
    };
    recognition.start();
  };

  // Reads the latest assistant response aloud.
  $('bv-speak').onclick = () => {
    const answer = document.querySelector(
      '.assistant-message:last-child, .ai-message:last-child, [data-role="assistant"]:last-child'
    );
    const text = answer?.innerText?.trim();

    if (!text) {
      $('bv-status').textContent =
        'No AI answer found yet. Connect this button to your answer element.';
      return;
    }

    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    window.speechSynthesis.speak(utterance);
  };

  // IMPORTANT: connect this button to your existing message/API function.
  $('bv-send').onclick = () => {
    const input = document.querySelector(
      '#message-input, #message, textarea, input[type="text"]'
    );
    const message = input?.value?.trim();

    if (!message && !selectedFile) {
      $('bv-status').textContent = 'Please type a message or choose a file.';
      return;
    }

    $('bv-status').textContent =
      'Input ready. Connect bv-send to your existing AI send/API function.';
    // Your existing backend send function must be called here.
    // Send selectedFile using FormData if your backend supports attachments.
  };
})();
</script>
